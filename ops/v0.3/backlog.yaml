version: 2
defaults:
  required_gates:
  - qa
  - preflight
  - seed_replay_batch_twice
  merge_target: codex/v0.3-refactor-kickoff
  auto_merge_to_main: false
  claim:
    status: unclaimed
    claimed_by: ''
    claimed_at: ''
    claim_expires_at: ''
    run_id: ''
status_values:
- todo
- ready
- in_progress
- blocked
- done
- escalated
selection_rule: pick first ready with deps all done and claim.status=unclaimed; no replanning
scheduler_semantics:
  execution_scope: scheduler selects from tasks only; epics are planning containers and are not directly executable
  blocked_lane_rule: any task in lane_branch codex/v0.3-lane-world-topology is ineligible until V03-XMAP-001 is done
  dependency_rule: world/topology tasks must explicitly depend on V03-XMAP-001
  same_lane_continuation_rule: after integrator acceptance, immediately promote and dispatch the next decomposed task in the same lane when its newly satisfied deps were completed in that lane and no cross-lane checkpoint, integrator boundary, or escalation applies
  claim_expiry_rule: a claim is stale once claim_expires_at is in the past
  claim_reclaim_rule: stale claims may be reset to unclaimed by the integrator chat or by a scheduler starting a new run after recording the reclaim event in the run log
  claim_refresh_rule: the claiming chat may extend claim_expires_at while it is actively working
releases:
- id: v0.3.0
  title: Foundations
  status: active
- id: v0.3.1
  title: Topology + obligations
  status: planned
- id: v0.3.2
