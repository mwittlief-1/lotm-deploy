version: 1
toolchain:
  node_source_of_truth: "package.json#engines.node"
  package_manager: "npm"
  package_manager_source_of_truth: "package.json#packageManager"
  lockfile: "package-lock.json"
environment_rules:
  ci_vercel_mismatch: "E1_stop_and_report"
  fix_forward_without_note: false
control_plane_rules:
  backlog_version: 2
  executable_queue: "tasks_only"
  default_claim_ttl_hours: 4
  scheduler_mode: "lane_parallel"
  progress_active_claims_field: "active_claims"
  same_lane_continuation: "lane_may_self_chain_safe_same_lane_follow_ons_until_cross_lane_or_integrator_boundary"
  same_lane_prepromotion:
    allowed: true
    purpose: "avoid scheduler-promotion stalls on clean same-lane chains"
    conditions:
      - "next task is in the same lane"
      - "next task requires_integrator is false"
      - "the only unmet deps are the currently active same-lane predecessor tasks"
      - "no cross-lane blocker, checkpoint, or integrator-only boundary applies"
    effect:
      - "integrator may mark the successor task ready before the predecessor is reconciled"
      - "lane may self-claim the successor after locally closing the predecessor"
  lane_local_self_advance:
    allowed: true
    kickoff_remains_authoritative_for_cross_lane_coordination: true
    conditions:
      - "next task is in the same lane"
      - "next task requires_integrator is false"
      - "all cross-lane deps are already done in kickoff truth"
      - "only same-lane deps may be satisfied by lane-local completed tasks not yet integrated"
      - "scheduler promotion is not required when same_lane_prepromotion conditions are met"
      - "no checkpoint, escalation, or integrator-only boundary applies"
      - "lane keeps at most one active task at a time"
    required_records:
      - "close current task in the lane-local run log"
      - "record the local claim transition for the next task in the lane-local run log"
      - "update lane-local backlog/progress state so integrator can reconcile the chain later"
    prohibited:
      - "skip over decomposed tasks"
      - "advance across requires_integrator true tasks"
      - "use lane-local provisional claims as cross-lane scheduling authority"
  non_checkpoint_tasks_require_parent_epic: true
  external_checkpoint_parent_epic_optional: true
  current_task_must_reference_task_id: true
  current_task_semantics: "first_globally_claimable_ready_task"
  repo_truth_path_rewrites:
    - "src/sim/relationshipEngine.ts -> src/sim/domains/people/relationshipEngine.ts"
    - "src/components/** -> src/App.tsx + src/ui/**"
    - "docs/ui/** -> docs/ux/**"
  world_topology_import_surface:
    status: "frozen_until_checkpoint_changes"
    repo_truth_commit: "eaa9da5"
    data_paths:
      - "data/map/xmap_alpha_v1/manor_units_v1.json"
      - "data/map/xmap_alpha_v1/holding_fabric_v1.json"
      - "data/map/xmap_alpha_v1/world_topology_v1.json"
      - "data/map/xmap_alpha_v1/xmap_alpha_manifest_v1.json"
    docs_paths:
      - "docs/schemas/xmap_alpha_v1.md"
      - "docs/arch/XMAP_ALPHA_HANDOFF.md"
      - "docs/HOLDING_FABRIC_LEGAL_RULES_v0_1.md"
    no_new_import_before_checkpoint: true
    rebase_after_checkpoint:
      - "V03-R1-001-T01"
      - "V03-R1-001-T02"
    first_remaining_map_coded_task_after_checkpoint: "V03-R1-001-T03"
    integrator_follow_on_after_rebase: "V03-R1-001-T04"
    preserved_semantics:
      - "stable manor_id"
      - "stable higher-order holding ids"
      - "territorial adjacency semantics"
      - "route adjacency semantics"
      - "weighted route graph semantics"
      - "travel_cost_distance meaning"
      - "route_hop_distance meaning"
      - "holding_fabric_legal_rules_v0_1 field family"
  reclaim_note_required: true
  reclaim_note_fields:
    - prior_claimed_by
    - prior_claim_expires_at
    - reclaiming_run_id
  lane_acceptance:
    intake_audit_required: true
    require_completed_for_acceptance: true
    task_packet_fields:
      - exact_deliverables
      - definition_of_done
      - required_test_updates
      - stop_rules
      - handoff_requirements
    allowed_delivery_states:
      - completed
      - blocked
      - advanced_not_claimable
    required_report_metadata:
      - Task ID
      - Branch
      - Kickoff Base Commit
      - Commit
    required_report_sections:
      - Delivery state
      - Task evidence
      - Handoff
    required_report_fields:
      Delivery state:
        - state
        - summary
      Task evidence:
        - changed_files
        - contracts_or_surfaces
        - tests_run
      Handoff:
        - next_task_hint
        - do_not_advance
        - blockers
run_logging_required:
  - node_version
  - npm_version
  - git_branch
  - git_commit
  - ci_env
  - vercel_env
  - gate_results
  - replay_hashes
  - pr_url
  - pr_status
budgets:
  snapshot_cap_bytes_per_turn: 524288
  turn_time_soft_ceiling_ms_per_seed: 250
