version: 1
rules:
  auto_merge_to_main: false
  main_updates: "PR_merge_only"
  integration_branch: "codex/v0.3-refactor-kickoff"
  lane_branch_pattern: "codex/v0.3-lane-*"
  canonical_lane_branches:
    - "codex/v0.3-refactor-kickoff"
    - "codex/v0.3-lane-tooling-qa"
    - "codex/v0.3-lane-social-mechanics"
    - "codex/v0.3-lane-engine-core"
    - "codex/v0.3-lane-ui-experience"
    - "codex/v0.3-lane-economy-fiscal"
    - "codex/v0.3-lane-world-topology"
  lane_branch_bootstrap_source: "codex/v0.3-refactor-kickoff"
  lane_handoff:
    commit_required: true
    push_required: true
    pr_target: "codex/v0.3-refactor-kickoff"
    pr_action: "open_or_update_after_passing_gates"
    report_required: true
    kickoff_base_commit_required: true
    report_template: "ops/v0.3/templates/run-log.md"
    intake_audit_command: "npm run ops:v0.3:intake-audit -- --task <TASK_ID> --require-completed"
    required_packet_fields:
      - branch
      - kickoff_base_commit
      - commit
      - report_path
      - delivery_state
      - changed_files
      - tests_run
  lane_rebootstrap:
    stale_branch_rejection: true
    required_after:
      - "release reset or intake reset lands on kickoff"
      - "lane progress/latest.yaml still points at a prior release chain"
    required_action: "rebase or recreate the lane branch from the current kickoff head before continuing task work"
  integrator_handoff:
    merge_target: "codex/v0.3-refactor-kickoff"
    merge_policy: "integrator_only"
    acceptance_checklist: "ops/v0.3/templates/intake-review.md"
  integrator_only_paths:
    - "src/sim/turn.ts"
    - "src/sim/phases/**"
